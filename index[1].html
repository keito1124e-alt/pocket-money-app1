<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="お小遣い">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>お小遣い管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding-bottom:80px}header{padding:20px 18px 10px;position:sticky;top:0;background:#fff;z-index:3}
h1{margin:0;font-size:24px}.sub,.muted,.small{color:#777}.sub,.small{font-size:12px}.page{display:none;padding:12px 16px}.page.active{display:block}
.card{background:#f7f7f7;border-radius:18px;padding:16px;margin-bottom:12px}.balance{font-size:38px;font-weight:800;margin:5px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border-radius:14px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.full{width:100%}button{font:inherit;border:0;cursor:pointer}.primary{background:#111;color:#fff;padding:13px 16px;border-radius:13px;font-weight:700}.secondary{background:#e9e9e9;padding:10px 13px;border-radius:12px}.danger{background:#ffe8eb;color:#a00020;padding:8px 10px;border-radius:10px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:70px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.tab{background:none;color:#777;font-size:11px}.tab.active{color:#111;font-weight:800}.tab span{display:block;font-size:22px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff;font:inherit}label{display:block;font-size:12px;color:#666;margin:10px 0 5px}
.bar{height:13px;background:#ddd;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#111;border-radius:99px}.item{padding:12px 0;border-bottom:1px solid #eee}.amount{font-weight:800}.income{color:#16733b}.expense{color:#b00020}.planned{color:#6655aa}
.month{font-size:18px;font-weight:800}.day{border:1px solid #eee;border-radius:14px;padding:10px;margin:8px 0}.chat{height:420px;overflow:auto}.bubble{max-width:85%;padding:10px 12px;border-radius:15px;margin:8px 0;white-space:pre-wrap}.ai{background:#eee}.me{background:#111;color:#fff;margin-left:auto}.quick{display:flex;gap:7px;overflow:auto;padding:5px 0}.quick button{white-space:nowrap}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:20}.sheet{width:100%;max-width:520px;margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}
</style></head><body><div class="app">
<header><h1>お小遣い</h1><div class="sub" id="today"></div></header>
<section id="home" class="page active"><div class="card"><div class="muted">現在の残高</div><div class="balance" id="balance">¥0</div><div class="grid"><div class="stat"><span class="muted">今月の収入</span><b id="inc">¥0</b></div><div class="stat"><span class="muted">今月の支出</span><b id="exp">¥0</b></div></div></div>
<div class="card"><div class="row between"><b>今月あと使える目安</b><b id="limit">¥0</b></div><div class="bar" style="margin-top:10px"><i id="limitbar"></i></div><div class="small" id="limitnote"></div></div>
<div class="card"><div class="row between"><b>貯金目標</b><b id="goal">¥0</b></div><div class="bar" style="margin-top:10px"><i id="goalbar"></i></div><div class="small" id="goalnote"></div></div>
<div class="row"><button class="primary full" onclick="record('expense')">＋ 支出を記録</button><button class="secondary" onclick="record('income')">収入</button></div></section>
<section id="calendar" class="page"><div class="row between"><button class="secondary" onclick="moveMonth(-1)">‹</button><b id="monthLabel"></b><button class="secondary" onclick="moveMonth(1)">›</button></div><div class="card" style="margin-top:12px"><div class="small">確定した入出金と予定</div><div id="days"></div></div><button class="primary full" onclick="plan()">＋ 予定を追加</button></section>
<section id="ai" class="page"><div class="card"><b>🤖 お小遣い相談</b><div class="small">「これ買おうと思うんだけどどう？」など、気軽に相談できます。</div></div><div class="card chat" id="chat"></div><div class="quick"><button class="secondary" onclick="ask('今月あといくら使える？')">今月あといくら？</button><button class="secondary" onclick="ask('1000円使っていい？')">1000円使っていい？</button><button class="secondary" onclick="ask('貯金状況を教えて')">貯金状況</button></div><div class="row" style="margin-top:8px"><input id="chatInput" placeholder="相談内容を入力"><button class="primary" onclick="send()">送信</button></div></section>
<section id="settings" class="page"><div class="card"><b>基本設定</b><label>現在の残高</label><input id="sBal" type="number"><label>貯金目標額</label><input id="sGoal" type="number"><label>毎月のお小遣い</label><input id="sAllow" type="number"><button class="primary full" style="margin-top:12px" onclick="settings()">保存</button></div><div class="card"><b>カテゴリー</b><div id="cats"></div><div class="row" style="margin-top:10px"><input id="newCat" placeholder="カテゴリー名"><button class="secondary" onclick="addCat()">追加</button></div></div><div class="card"><button class="secondary full" onclick="backup()">バックアップを書き出す</button></div><div class="card small">データは端末のブラウザ内に保存します。AI相談も端末内の簡易ロジックです。</div></section>
<nav class="tabs"><button class="tab active" data-p="home"><span>⌂</span>ホーム</button><button class="tab" data-p="calendar"><span>□</span>カレンダー</button><button class="tab" data-p="ai"><span>✦</span>AI相談</button><button class="tab" data-p="settings"><span>⚙</span>設定</button></nav></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY="pocketMoneyV4";let d=JSON.parse(localStorage.getItem(KEY)||"null")||{balance:null,targetSaving:10000,monthlyAllowance:3000,lastAllowanceMonth:"",categories:["コンビニ","趣味","買い物","その他"],tx:[],plans:[]};let vd=new Date();
const yen=n=>"¥"+Math.round(n||0).toLocaleString("ja-JP"),pad=n=>String(n).padStart(2,"0"),iso=x=>x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()),ym=x=>x.getFullYear()+"-"+pad(x.getMonth()+1),save=()=>localStorage.setItem(KEY,JSON.stringify(d));
function allowance(){if(d.balance===null)return;let x=new Date(),m=ym(x);if(x.getDate()>=25&&d.lastAllowanceMonth!==m){d.tx.push({date:iso(x),type:"income",amount:d.monthlyAllowance,category:"お小遣い",memo:"毎月25日"});d.lastAllowanceMonth=m;save()}}
function bal(){return(d.balance||0)+d.tx.reduce((s,t)=>s+(t.type==="income"?t.amount:-t.amount),0)}
function mt(){return d.tx.filter(t=>t.date.startsWith(ym(new Date())))}function mi(){return mt().filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0)}function me(){return mt().filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0)}
function lim(){let goal=d.targetSaving||0,b=bal(),p=d.plans.filter(x=>x.date.startsWith(ym(new Date()))),net=p.reduce((s,x)=>s+(x.type==="income"?x.amount:-x.amount),0),income=Math.max(0,mi()+net),reserve=Math.min(income,Math.max(0,goal-b)),l=Math.max(0,income-reserve);return{limit:l,spent:me(),remain:Math.max(0,l-me())}}
function render(){allowance();today.textContent=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric"});balance.textContent=yen(bal());inc.textContent=yen(mi());exp.textContent=yen(me());let x=lim();limit.textContent=yen(x.remain);limitbar.style.width=(x.limit?Math.min(100,x.spent/x.limit*100):0)+"%";limitnote.textContent="今月の支出枠 "+yen(x.limit)+" ／ 支出 "+yen(x.spent);goal.textContent=yen(d.targetSaving);goalbar.style.width=(d.targetSaving?Math.min(100,bal()/d.targetSaving*100):0)+"%";goalnote.textContent="現在 "+yen(bal())+" ／ 目標 "+yen(d.targetSaving);sBal.value=d.balance??"";sGoal.value=d.targetSaving;sAllow.value=d.monthlyAllowance;renderCal();renderCats();if(!chat.children.length)bubble("ai","こんにちは！現在の残高・今月の支出・登録した予定を見ながら相談できます。")}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===b.dataset.p));document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b))});
const modalEl=document.getElementById("modal");function modal(x){sheet.innerHTML=x;modalEl.style.display="flex"}function close(){modalEl.style.display="none"}
if(d.balance===null)modal('<h2>最初に残高を設定</h2><p class="muted">今持っている自分のお金を入力してください。</p><input id="start" type="number" inputmode="numeric" placeholder="例：8500"><button class="primary full" style="margin-top:12px" onclick="start()">はじめる</button>');
function start(){let n=Number(start.value);if(n<0)return;d.balance=n;save();close();render()}
function record(type){modal('<h2>'+(type==="expense"?"支出":"収入")+'を記録</h2><label>金額</label><input id="a" type="number" inputmode="numeric"><label>カテゴリー</label><select id="c">'+d.categories.map(x=>'<option>'+x+'</option>').join("")+'</select><label>日付</label><input id="dt" type="date" value="'+iso(new Date())+'"><label>メモ</label><input id="memo" placeholder="何に使った？"><button class="primary full" style="margin-top:14px" onclick="saveTx(\''+type+'\')">保存</button>')}
function saveTx(type){let a=Number(document.getElementById("a").value);if(!a)return;d.tx.push({date:dt.value,type,amount:a,category:c.value,memo:memo.value});save();close();render()}
function plan(){modal('<h2>予定を追加</h2><label>日付</label><input id="pd" type="date" value="'+iso(new Date())+'"><label>種類</label><select id="pt"><option value="expense">支出予定</option><option value="income">収入予定</option></select><label>金額</label><input id="pa" type="number"><label>メモ</label><input id="pm" placeholder="例：ゲームを買う予定"><p class="small">予定は現在の残高には反映されませんが、AI相談では考慮します。</p><button class="primary full" onclick="savePlan()">保存</button>')}
function savePlan(){let a=Number(pa.value);if(!a)return;d.plans.push({date:pd.value,type:pt.value,amount:a,memo:pm.value});save();close();render()}
function moveMonth(n){vd.setMonth(vd.getMonth()+n);renderCal()}
function renderCal(){monthLabel.textContent=vd.toLocaleDateString("ja-JP",{year:"numeric",month:"long"});let m=ym(vd),all=[...d.tx.filter(t=>t.date.startsWith(m)).map(t=>({...t,p:false})),...d.plans.filter(t=>t.date.startsWith(m)).map(t=>({...t,p:true}))],g={};all.forEach(t=>(g[t.date]??=[]).push(t));days.innerHTML=Object.keys(g).sort().reverse().map(k=>'<div class="day"><b>'+new Date(k+"T00:00").toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",weekday:"short"})+'</b>'+g[k].map(t=>'<div class="item row between"><div><b>'+ (t.memo||t.category||"予定")+'</b><div class="small">'+(t.p?"予定":"確定")+'</div></div><span class="amount '+(t.type==="income"?"income":"expense")+'">'+(t.type==="income"?"+":"-")+yen(t.amount)+'</span></div>').join("")+'</div>').join("")||"<p class='muted'>記録なし</p>"}
function renderCats(){cats.innerHTML=d.categories.map((x,i)=>'<div class="row between item"><span>'+x+'</span><button class="danger" onclick="delCat('+i+')">削除</button></div>').join("")}
function addCat(){let x=newCat.value.trim();if(x&&!d.categories.includes(x))d.categories.push(x);newCat.value="";save();render()}function delCat(i){if(d.categories.length>1)d.categories.splice(i,1);save();render()}
function settings(){let b=Number(sBal.value),g=Number(sGoal.value),a=Number(sAllow.value);if(b<0||g<0||a<0)return;d.balance=b;d.targetSaving=g;d.monthlyAllowance=a;save();render();alert("保存しました")}
function bubble(w,t){let x=document.createElement("div");x.className="bubble "+(w==="ai"?"ai":"me");x.textContent=t;chat.appendChild(x);chat.scrollTop=chat.scrollHeight}function ask(x){chatInput.value=x;send()}
function send(){let q=chatInput.value.trim();if(!q)return;bubble("me",q);chatInput.value="";let x=lim(),b=bal(),m=(q.match(/(\d[\d,]*)\s*円/)||[])[1],p=m?Number(m.replace(/,/g,"")):null,ans;if(/あと|使える|限度|予算/.test(q))ans="今月の支出枠は"+yen(x.limit)+"、すでに"+yen(x.spent)+"使っているので、残りの目安は"+yen(x.remain)+"です。";else if(/貯金|貯め|目標/.test(q))ans="現在の残高は"+yen(b)+"、貯金目標は"+yen(d.targetSaving)+"です。目標まで"+yen(Math.max(0,d.targetSaving-b))+"です。";else if(p!==null)ans=p<=x.remain?yen(p)+"なら今月の残り目安"+yen(x.remain)+"の範囲内です。登録した予定も確認してから決めると安心です。":yen(p)+"だと今月の残り目安を"+yen(p-x.remain)+"超えます。";else ans="現在の残高は"+yen(b)+"、今月の支出は"+yen(me())+"です。具体的な金額を送ってくれれば数字で一緒に考えます。";setTimeout(()=>bubble("ai",ans),150)}
function backup(){let z=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(z);a.download="お小遣い管理バックアップ.json";a.click();URL.revokeObjectURL(a.href)}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
